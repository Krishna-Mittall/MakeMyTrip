spring.application.name=makemytrip
server.port=${PORT:8080}
# MongoDB: set MONGODB_URI (for example a MongoDB Atlas connection string) in the environment
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=makemytrip
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# review photos (they are resized in the browser before they are uploaded)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# sample flights, hotels, admin / moderator accounts are created when the database is empty
app.seed.enabled=true

# Browser push notifications (Web Push). Leave the keys empty to generate them once and keep them in the database.
app.push.public-key=${VAPID_PUBLIC_KEY:}
app.push.private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:admin@makemytour.com}
app.push.allow-insecure-endpoints=${PUSH_ALLOW_INSECURE:false}
